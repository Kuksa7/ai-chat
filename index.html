<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
:root{
  --bg:#0a1430; --bg2:#0f1c40; --panel:#132453; --panel2:#1a2e66; --border:#24397a;
  --text:#e6ecff; --muted:#8fa0cf; --accent:#4d7cff; --accent2:#6b93ff; --danger:#ff5d73;
  --user:#1f3b8a; --code:#07102a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.app{display:flex;height:100%}
/* sidebar */
.sidebar{width:270px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:margin .2s}
.sidebar.hidden{margin-left:-270px}
.side-top{padding:12px;display:flex;flex-direction:column;gap:8px}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.chat-item:hover{background:var(--panel)}
.chat-item.active{background:var(--panel2);color:var(--text)}
.chat-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .act{display:none;background:none;border:none;color:var(--muted);padding:0 3px}
.chat-item:hover .act{display:inline}
.chat-item .act:hover{color:var(--text)}
.side-bottom{padding:12px;border-top:1px solid var(--border)}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg2)}
.topbar select{width:auto;max-width:260px}
.topbar .title{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:17px}
.icon-btn:hover{background:var(--panel);border-color:var(--border)}
.messages{flex:1;overflow-y:auto;padding:24px 0}
.msg-wrap{max-width:860px;margin:0 auto;padding:0 18px}
.msg{display:flex;gap:12px;margin-bottom:22px}
.msg .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel2)}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:var(--accent)}
.bubble{max-width:calc(100% - 50px);min-width:0}
.msg.user .bubble .body{background:var(--user);padding:10px 14px;border-radius:14px 4px 14px 14px;white-space:pre-wrap;word-wrap:break-word}
.msg.assistant .bubble .body{padding:4px 0;word-wrap:break-word}
.msg .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center}
.msg.user .meta{justify-content:flex-end}
.meta button{background:none;border:none;color:var(--muted);padding:0;font-size:12px}
.meta button:hover{color:var(--text)}
.body p{margin:0 0 .7em}.body p:last-child{margin-bottom:0}
.body pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:0;overflow:hidden;margin:.6em 0}
.body pre .code-head{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;color:var(--muted);background:#0b1636;border-bottom:1px solid var(--border)}
.body pre code{display:block;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Consolas,monospace}
.body code{background:var(--code);padding:1px 5px;border-radius:4px;font:13px ui-monospace,Consolas,monospace}
.body pre code{background:none}
.body a{color:var(--accent2)}
.body ul,.body ol{margin:.3em 0 .7em;padding-left:1.4em}
.body h1,.body h2,.body h3,.body h4{margin:.8em 0 .4em;line-height:1.3}
.body blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.2em .8em;color:var(--muted)}
.body table{border-collapse:collapse;margin:.6em 0;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:5px 9px}
.body th{background:var(--panel)}
.body hr{border:none;border-top:1px solid var(--border)}
.think{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;color:var(--muted);font-size:13px}
.think summary{cursor:pointer;padding:6px 10px}
.think div{padding:0 10px 8px;white-space:pre-wrap}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.msg.user .atts{justify-content:flex-end}
.atts img{max-width:220px;max-height:180px;border-radius:10px;border:1px solid var(--border);cursor:zoom-in}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px}
.error{color:var(--danger);background:rgba(255,93,115,.08);border:1px solid rgba(255,93,115,.35);border-radius:8px;padding:8px 12px}
.cursor::after{content:"▋";animation:blink 1s infinite;color:var(--accent2)}
@keyframes blink{50%{opacity:0}}
.empty{text-align:center;color:var(--muted);margin-top:16vh}
.empty h1{color:var(--text);font-weight:600;margin-bottom:6px}
/* composer */
.composer{padding:12px 18px 18px}
.composer-inner{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:8px}
.composer-inner.drag{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,124,255,.25)}
.pending{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 8px}
.pending:empty{display:none}
.pend{position:relative}
.pend img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block}
.pend .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);border:none;color:#fff;font-size:12px;line-height:20px;padding:0}
.row{display:flex;align-items:flex-end;gap:6px}
.row textarea{border:none;background:transparent;resize:none;max-height:240px;min-height:24px;padding:8px}
.send{display:flex;align-items:center;justify-content:center;background:var(--accent);border:none;border-radius:10px;width:40px;height:40px;color:#fff;font-size:18px;flex-shrink:0}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--danger)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,8,25,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:640px;max-width:100%;max-height:92vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:18px}
.tabs{display:flex;gap:4px;padding:10px 18px 0}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted)}
.tab.active{color:var(--text);border-color:var(--accent)}
.modal-body{padding:16px 18px;overflow-y:auto}
.pane{display:none}.pane.active{display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{flex:1}
.inline .btn{flex:0 0 auto;white-space:nowrap}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.small{font-size:12px;color:var(--muted);margin-top:4px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:95vh;border-radius:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
.toast.show{opacity:1}
@media(max-width:760px){.sidebar{position:fixed;z-index:40;height:100%}.topbar select{max-width:130px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button class="btn primary" id="newChat">＋ Новый чат</button>
      <input id="search" placeholder="Поиск по чатам…">
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom"><div class="small" id="syncBadge" style="text-align:center;margin:0 0 8px">☁️ Синхронизация выключена</div><button class="btn" style="width:100%" id="openSettings2">⚙️ Настройки</button></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSide" title="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      <div class="title" id="chatTitle">Новый чат</div>
      <select id="providerSel" title="Провайдер"></select>
      <select id="modelSel" title="Модель"></select>
      <button class="icon-btn" id="openSettings" title="Настройки">⚙️</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-inner" id="composer">
        <div class="pending" id="pending"></div>
        <div class="row">
          <button class="icon-btn" id="attachBtn" title="Прикрепить файл или картинку">📎</button>
          <input type="file" id="fileInput" multiple hidden>
          <textarea id="input" rows="1" placeholder="Напишите сообщение… (можно вставить картинку Ctrl+V или перетащить файл)"></textarea>
          <button class="send" id="sendBtn" title="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5V3.5L22 12 3 20.5zm2-3.1L16.9 12 5 6.6V10l6 2-6 2v3.4z"/></svg></button>
        </div>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
    </div>
  </main>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <div class="modal-head"><h2>Настройки</h2><button class="icon-btn" id="closeSettings">✕</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="model">Модель</button>
      <button class="tab" data-tab="keys">API-ключи</button>
      <button class="tab" data-tab="gen">Генерация</button>
      <button class="tab" data-tab="sync">Синхронизация</button>
      <button class="tab" data-tab="data">Данные</button>
    </div>
    <div class="modal-body">
      <div class="pane active" data-pane="model">
        <div class="field"><label>Провайдер</label><select id="sProvider"></select></div>
        <div class="field"><label>Модель из списка</label>
          <div class="inline"><select id="sModel"></select><button class="btn" id="fetchModels">↻ Загрузить с сервера</button></div>
          <div class="small" id="fetchStatus"></div>
        </div>
        <div class="field"><label>Или введите id модели вручную (имеет приоритет)</label><input id="sCustomModel" placeholder="например, openai/gpt-4o"></div>
        <div class="field"><label>Base URL провайдера</label><input id="sBaseUrl"><div class="small">OpenAI-совместимый endpoint; запрос идёт на {baseUrl}/chat/completions</div></div>
      </div>
      <div class="pane" data-pane="keys" id="keysPane"></div>
      <div class="pane" data-pane="gen">
        <div class="field"><label>Системный промпт</label><textarea id="sSystem" rows="4" placeholder="Ты полезный ассистент…"></textarea></div>
        <div class="field"><label>Temperature: <span id="tempVal"></span></label><input type="range" id="sTemp" min="0" max="2" step="0.05"></div>
        <div class="field"><label>Max tokens (пусто — по умолчанию)</label><input type="number" id="sMaxTokens" min="1"></div>
        <div class="field"><label>Сколько последних сообщений отправлять как контекст (0 — все)</label><input type="number" id="sContext" min="0"></div>
        <div class="field check"><input type="checkbox" id="sStream"><label for="sStream" style="margin:0;color:var(--text)">Потоковый вывод (streaming)</label></div>
        <div class="field check"><input type="checkbox" id="sAutoTitle"><label for="sAutoTitle" style="margin:0;color:var(--text)">Автоназвание чата по первому сообщению</label></div>
      </div>
      <div class="pane" data-pane="sync">
        <div id="syncOut">
          <div class="field small" style="margin-bottom:12px">Войдите в один и тот же аккаунт на ПК и телефоне — чаты будут синхронизироваться через Supabase.</div>
          <div class="field"><label>Почта</label><input type="email" id="sbEmail" autocomplete="email" placeholder="you@mail.com"></div>
          <div class="field"><label>Пароль (от 6 символов)</label><input type="password" id="sbPass" autocomplete="current-password"></div>
          <div class="inline" style="justify-content:flex-start"><button class="btn primary" id="loginBtn">Войти</button><button class="btn" id="signupBtn">Регистрация</button></div>
        </div>
        <div id="syncIn" hidden>
          <div class="field">Вы вошли как <b id="syncEmail"></b></div>
          <div class="field check"><input type="checkbox" id="sSyncSettings"><label for="sSyncSettings" style="margin:0;color:var(--text)">Синхронизировать настройки и API-ключи</label></div>
          <div class="inline" style="justify-content:flex-start"><button class="btn primary" id="syncNowBtn">🔄 Синхронизировать сейчас</button><button class="btn" id="logoutBtn">Выйти</button></div>
        </div>
        <div class="small" id="syncMsg" style="margin-top:12px"></div>
      </div>
      <div class="pane" data-pane="data">
        <div class="field"><label>Чаты хранятся в этом браузере (IndexedDB), ключи — в localStorage.</label>
          <div class="inline" style="flex-wrap:wrap">
            <button class="btn" id="exportBtn">⬇️ Экспорт чатов (JSON)</button>
            <button class="btn" id="importBtn">⬆️ Импорт чатов</button>
            <input type="file" id="importInput" accept=".json" hidden>
          </div>
        </div>
        <div class="field"><button class="btn danger" id="clearAll">🗑 Удалить все чаты</button></div>
        <div class="field"><button class="btn danger" id="resetSettings">↺ Сбросить настройки и ключи</button></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelSettings">Отмена</button><button class="btn primary" id="saveSettings">Сохранить</button></div>
  </div>
</div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
// ============ ПРОВАЙДЕРЫ (из config.js) ============
const PROVIDERS = {
  anymodel: { name: "anymodel.org", baseUrl: "https://anymodel.org/v1", models: [
    "cx/gpt-5.6-luna","am/kimi-k3","am/nemotron-3-ultra-550b-a55b","cc/claude-sonnet-5","ds/deepseek-v4-pro","cx/gpt-6-luna","cx/gpt-6.1-sol"]},
  openrouter: { name: "OpenRouter", baseUrl: "https://openrouter.ai/api/v1", models: [
    "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free","deepseek/deepseek-v4-flash-0731","z-ai/glm-5.3-flash",
    "nvidia/nemotron-3.5-lightning:free","qwen/qwen3.8-27b:free","dots-studio/dots-3-note-preview:free",
    "thinkingmachines/inkling:free","nex-agi/nex-n2.5-pro:free","nvidia/nemotron-3.5-content-safety:free",
    "nvidia/nemotron-3-ultra-550b-a55b:free"]},
  nyxos: { name: "Nyxos (QuantumNous)", baseUrl: "https://api.nyxos.shop/v1", models: [
    "qwen3.8-flash","deepseek-v4-flash","gpt-4-turbo","gpt-5.4-mini","gpt-5.6-terra","claude-3-haiku-20240307",
    "gpt-6-sol","gpt-5-nano","gemini-1.5-pro","gpt-5.6-luna"]},
  xkiro: { name: "Xkiro", baseUrl: "https://api.xkiro.com/v1", models: [
    "qwen/qwen3.8-max:free","mistralai/mistral-large-4-0","inclusionai/ling-3.0-flash-sante:free","nvidia/nemotron-3-ultra"]},
  tooken: { name: "Tooken", baseUrl: "https://tooken.club/v1", models: [
    "deepseek-v4-pro","gpt-6-luna","claude-sonnet-5-5","glm-5.3"]}
};
const DEFAULTS = {
  provider:"anymodel", model:"cx/gpt-5.6-luna", customModel:"",
  keys:{anymodel:"",openrouter:"",nyxos:"",xkiro:"",tooken:""},
  baseUrls:{}, fetchedModels:{},
  system:"", temperature:0.7, maxTokens:"", context:0, stream:true, autoTitle:true
};

// ============ СОСТОЯНИЕ ============
const $ = s => document.querySelector(s);
let settings = loadSettings();
let chats = [];           // [{id,title,created,updated,provider,model,messages:[]}]
let currentId = null;
let pending = [];         // вложения до отправки
let controller = null; let genChatId = null;    // AbortController текущего запроса

function loadSettings(){
  try{ const s = JSON.parse(localStorage.getItem("aichat_settings")||"{}");
    return {...structuredClone(DEFAULTS), ...s, keys:{...DEFAULTS.keys, ...(s.keys||{})}}; }
  catch{ return structuredClone(DEFAULTS); }
}
function saveSettingsLS(){ settings.updatedAt = Date.now(); if(typeof scheduleSync==="function") scheduleSync(); localStorage.setItem("aichat_settings", JSON.stringify(settings)); }
const baseUrlOf = p => (settings.baseUrls[p] || PROVIDERS[p].baseUrl).replace(/\/+$/,"");
const modelsOf = p => { const f = settings.fetchedModels[p]; const base = PROVIDERS[p].models.filter(Boolean);
  return f && f.length ? [...new Set([...base, ...f])] : base; };
const activeModel = () => settings.customModel.trim() || settings.model;

// ============ IndexedDB ============
let db;
function openDB(){ return new Promise((res,rej)=>{ const r = indexedDB.open("aichat_db",1);
  r.onupgradeneeded = () => r.result.createObjectStore("chats",{keyPath:"id"});
  r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => rej(r.error); }); }
function dbAll(){ return new Promise(res=>{ const q = db.transaction("chats").objectStore("chats").getAll(); q.onsuccess=()=>res(q.result||[]); }); }
function dbPut(c){ return new Promise(res=>{ const t = db.transaction("chats","readwrite"); t.objectStore("chats").put(c); t.oncomplete=res; }); }
function dbDel(id){ return new Promise(res=>{ const t = db.transaction("chats","readwrite"); t.objectStore("chats").delete(id); t.oncomplete=res; }); }
function dbClear(){ return new Promise(res=>{ const t = db.transaction("chats","readwrite"); t.objectStore("chats").clear(); t.oncomplete=res; }); }

// ============ УТИЛИТЫ ============
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1800); }
const fmtTime = ts => new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

// ---- простой Markdown ----
function md(src){
  if(!src) return "";
  const blocks = [];
  src = src.replace(/```([\w+-]*)\n?([\s\S]*?)(```|$)/g, (m,lang,code) => {
    blocks.push(`<pre><div class="code-head"><span>${esc(lang||"code")}</span><button class="copy-code">Копировать</button></div><code>${esc(code.replace(/\n$/,""))}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+|data:image[^)\s]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:8px">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>")
    .replace(/~~([^~]+)~~/g,"<s>$1</s>");
  const lines = src.split("\n"); let html = "", i = 0;
  while(i < lines.length){
    let l = lines[i];
    if(/^\u0000\d+\u0000$/.test(l.trim())){ html += l.trim(); i++; continue; }
    if(/^#{1,6}\s/.test(l)){ const n = l.match(/^#+/)[0].length; html += `<h${Math.min(n,4)}>${inline(l.replace(/^#+\s/,""))}</h${Math.min(n,4)}>`; i++; continue; }
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){ html += "<hr>"; i++; continue; }
    if(/^>\s?/.test(l)){ let q=[]; while(i<lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/,"")); html += `<blockquote>${md(q.join("\n"))}</blockquote>`; continue; }
    if(/^\|.*\|\s*$/.test(l) && i+1<lines.length && /^\|?\s*:?-+/.test(lines[i+1])){
      const row = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      let t = "<table><tr>"+row(l).map(c=>`<th>${inline(c)}</th>`).join("")+"</tr>"; i+=2;
      while(i<lines.length && /^\|.*\|\s*$/.test(lines[i])) t += "<tr>"+row(lines[i++]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>";
      html += t+"</table>"; continue;
    }
    if(/^\s*([-*+]|\d+[.)])\s/.test(l)){
      const ordered = /^\s*\d/.test(l); let items=[];
      while(i<lines.length && (/^\s*([-*+]|\d+[.)])\s/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if(/^\s*([-*+]|\d+[.)])\s/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s/,"")); else items[items.length-1]+=" "+lines[i].trim(); i++; }
      html += (ordered?"<ol>":"<ul>")+items.map(x=>`<li>${inline(x)}</li>`).join("")+(ordered?"</ol>":"</ul>"); continue;
    }
    if(!l.trim()){ i++; continue; }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\u0000)/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i])) p.push(lines[i++]);
    if(!p.length){ p.push(lines[i++]); }
    html += `<p>${p.map(inline).join("<br>")}</p>`;
  }
  return html.replace(/\u0000(\d+)\u0000/g,(m,n)=>blocks[n]);
}
function splitThink(text){
  const m = text.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if(!m) return {think:"", rest:text};
  return {think:m[1].trim(), rest:text.slice(m[0].length)};
}

function attsHtml(atts){

    ? `<img src="${a.dataUrl}" alt="${esc(a.name)}" class="zoom">`

function assistantBody(m){

  if(m.error) h += `<div class="error">⚠️ ${esc(m.error)}</div>`;

}

const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|jsonl|xml|html?|css|js|mjs|ts|tsx|jsx|py|java|c|cpp|h|hpp|cs|go|rs|rb|php|sh|bat|ps1|sql|yaml|yml|toml|ini|cfg|log|env|vue|svelte|kt|swift|r|lua|pl|tex)$/i;
function readAs(file, how){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r[how](file); }); }
async function compressImage(dataUrl, max=1600){
  return new Promise(res=>{ const img = new Image(); img.onload = ()=>{
    const k = Math.min(1, max/Math.max(img.width,img.height));
    if(k===1 && dataUrl.length < 1.5e6) return res(dataUrl);
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",0.88)); };
    img.onerror = ()=>res(dataUrl); img.src = dataUrl; });
}
async function addFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith("image/")){
        const d = await compressImage(await readAs(f,"readAsDataURL"));
        pending.push({type:"image", name:f.name||"image.png", dataUrl:d});
      } else if(f.type.startsWith("text/") || TEXT_EXT.test(f.name) || f.type==="application/json"){
        if(f.size > 2e6){ toast("Файл слишком большой: "+f.name); continue; }
        pending.push({type:"file", name:f.name, text: await readAs(f,"readAsText")});
      } else if(f.type==="application/pdf"){
        pending.push({type:"pdf", name:f.name, dataUrl: await readAs(f,"readAsDataURL")});
      } else {
        // пробуем как текст
        const txt = await readAs(f,"readAsText");
        if(/[\u0000-\u0008]/.test(txt.slice(0,2000))){ toast("Неподдерживаемый формат: "+f.name); continue; }
        pending.push({type:"file", name:f.name, text:txt});
      }
    }catch(err){ toast("Ошибка чтения "+f.name); }
  }
  renderPending();
}
function renderPending(){
  const box = $("#pending"); box.innerHTML = "";
  pending.forEach((a,i)=>{
    const el = document.createElement("div"); el.className="pend";
    el.innerHTML = (a.type==="image" ? `<img src="${a.dataUrl}">` : `<span class="chip">${a.type==="pdf"?"📕":"📄"} ${esc(a.name)}</span>`) + `<button class="x" title="Убрать">✕</button>`;
    el.querySelector(".x").onclick = ()=>{ pending.splice(i,1); renderPending(); };
    box.appendChild(el);
  });
  updateSendBtn();
}

async function send(){

function buildApiMessages(c){
  let msgs = c.messages.filter(m => !m.error || m.content);
  if(settings.context > 0) msgs = msgs.slice(-settings.context);
  const out = [];
  if(settings.system.trim()) out.push({role:"system", content:settings.system.trim()});
  for(const m of msgs){
    if(m.role==="assistant"){ out.push({role:"assistant", content: splitThink(m.content||"").rest}); continue; }
    const atts = m.attachments||[];
    let text = m.content||"";
    atts.filter(a=>a.type==="file").forEach(a=>{ text += `\n\n--- Файл: ${a.name} ---\n\`\`\`\n${a.text}\n\`\`\``; });
    const imgs = atts.filter(a=>a.type==="image"), pdfs = atts.filter(a=>a.type==="pdf");
    if(!imgs.length && !pdfs.length){ out.push({role:"user", content:text}); continue; }
    const parts = [];
    if(text) parts.push({type:"text", text});
    imgs.forEach(a=>parts.push({type:"image_url", image_url:{url:a.dataUrl}}));
    pdfs.forEach(a=>parts.push({type:"file", file:{filename:a.name, file_data:a.dataUrl}}));
    out.push({role:"user", content:parts});
  }
  return out;
}

async function generate(){
  const c = current(); const p = settings.provider; const key = settings.keys[p]; const model = activeModel();
  const msg = {role:"assistant", content:"", reasoning:"", model, time:Date.now()};
  c.messages.push(msg);
  renderMessages();
  const el = $("#messages .msg-wrap").lastElementChild; const bodyEl = el.querySelector(".body");
  if(!key){ msg.error = `Не указан API-ключ для «${PROVIDERS[p].name}». Откройте ⚙️ Настройки → API-ключи.`; bodyEl.innerHTML = assistantBody(msg); await persist(c); return; }

  controller = new AbortController(); genChatId = c.id; updateSendBtn();
  bodyEl.classList.add("cursor");
  const box = $("#messages");
  const stick = () => box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let raf = 0;
  const repaint = () => { if(raf) return; raf = requestAnimationFrame(()=>{ raf=0; const s=stick(); bodyEl.innerHTML = assistantBody(msg); if(s) box.scrollTop = box.scrollHeight; }); };

  const body = { model, messages: buildApiMessages({messages:c.messages.slice(0,-1)}), stream: settings.stream, temperature: +settings.temperature };
  if(settings.maxTokens) body.max_tokens = +settings.maxTokens;
  const headers = {"Content-Type":"application/json", "Authorization":"Bearer "+key};
  if(p==="openrouter"){ headers["HTTP-Referer"] = location.origin.startsWith("http") ? location.origin : "https://localhost"; headers["X-Title"] = "AI Chat HTML"; }

  try{
    const res = await fetch(baseUrlOf(p)+"/chat/completions", {method:"POST", headers, body:JSON.stringify(body), signal:controller.signal});
    if(!res.ok){
      let t = await res.text(); try{ const j = JSON.parse(t); t = j.error?.message || j.message || t; }catch{}
      throw new Error(`HTTP ${res.status}: ${String(t).slice(0,500)}`);
    }
    const ctype = res.headers.get("content-type")||"";
    if(settings.stream && ctype.includes("event-stream")){
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
      while(true){
        const {done, value} = await reader.read(); if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n"); buf = lines.pop();
        for(const line of lines){
          const l = line.trim(); if(!l.startsWith("data:")) continue;
          const data = l.slice(5).trim(); if(data==="[DONE]") continue;
          try{ const j = JSON.parse(data);
            if(j.error) throw new Error(j.error.message || JSON.stringify(j.error));
            const d = j.choices?.[0]?.delta || {};
            if(d.content) msg.content += d.content;
            const r = d.reasoning_content || d.reasoning; if(r) msg.reasoning += r;
            repaint();
          }catch(err){ if(err.message && !(err instanceof SyntaxError)) throw err; }
        }
      }
    } else {
      const j = await res.json();
      if(j.error) throw new Error(j.error.message || JSON.stringify(j.error));
      const m = j.choices?.[0]?.message || {};
      msg.content = typeof m.content === "string" ? m.content : (m.content||[]).map(x=>x.text||"").join("");
      msg.reasoning = m.reasoning_content || m.reasoning || "";
      if(Array.isArray(m.images)) m.images.forEach(im=>{ const u = im.image_url?.url; if(u) msg.content += `\n\n![image](${u})`; });
    }
    if(!msg.content && !msg.reasoning) msg.error = "Пустой ответ от модели.";
  }catch(err){
    if(err.name==="AbortError"){ msg.content += msg.content ? "\n\n*— остановлено —*" : ""; if(!msg.content) msg.error = "Генерация остановлена."; }
    else msg.error = (err.message==="Failed to fetch")
      ? "Не удалось подключиться (Failed to fetch). Проверьте интернет, Base URL, или провайдер блокирует запросы из браузера (CORS)."
      : err.message;
  }finally{
    controller = null; updateSendBtn();
    bodyEl.classList.remove("cursor"); bodyEl.innerHTML = assistantBody(msg);
    await persist(c); renderList();
  }
}

$("#exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify({version:1, exported:new Date().toISOString(), chats},null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ai-chats-"+new Date().toISOString().slice(0,10)+".json"; a.click();
};
$("#importBtn").onclick = ()=>$("#importInput").click();
$("#importInput").onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{ const j = JSON.parse(await f.text()); const arr = Array.isArray(j) ? j : j.chats; let n=0;
    for(const c of arr){ if(!c.id || !Array.isArray(c.messages)) continue; await dbPut(c); const i = chats.findIndex(x=>x.id===c.id); i>=0 ? chats[i]=c : chats.push(c); n++; }
    renderList(); toast("Импортировано чатов: "+n);
  }catch{ toast("Неверный файл"); }
  e.target.value="";
};
$("#clearAll").onclick = async ()=>{ if(!confirm("Удалить ВСЕ чаты без возможности восстановления?")) return; chats.forEach(c=>markDeleted(c.id)); await dbClear(); chats=[]; closeS(); newChat(); };
$("#resetSettings").onclick = ()=>{ if(!confirm("Сбросить настройки и все API-ключи?")) return; localStorage.removeItem("aichat_settings"); settings = loadSettings(); refreshTop(); closeS(); toast("Сброшено"); };

// ============ СИНХРОНИЗАЦИЯ (Supabase) ============
const SB_URL = "https://zzxwasqopefigyqodrjj.supabase.co";
const SB_KEY = "sb_publishable_zuKRz4-RhcH6PXiMOXCd1w_rwqgvJfJ";
let sb = null, sbUser = null, syncing = false, syncAgain = false, syncTimer = null;
const getTomb = () => { try{ return JSON.parse(localStorage.getItem("aichat_tomb")||"{}"); }catch{ return {}; } };
const setTomb = t => localStorage.setItem("aichat_tomb", JSON.stringify(t));
const syncSettingsOn = () => localStorage.getItem("aichat_sync_settings") !== "0";
function markDeleted(id){ const t = getTomb(); t[id] = Date.now(); setTomb(t); scheduleSync(); }
function scheduleSync(){ if(!sbUser) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
function setBadge(t){ $("#syncBadge").textContent = t; }
function syncMsg(t, err){ const el = $("#syncMsg"); el.textContent = t||""; el.style.color = err ? "var(--danger)" : "var(--muted)"; }
function loadSB(){ return new Promise((res,rej)=>{ if(window.supabase) return res();
  const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  s.onload = res; s.onerror = ()=>rej(new Error("нет связи с Supabase")); document.head.appendChild(s); }); }
function renderSyncUI(){
  $("#syncOut").hidden = !!sbUser; $("#syncIn").hidden = !sbUser;
  if(sbUser) $("#syncEmail").textContent = sbUser.email; else setBadge("☁️ Синхронизация выключена");
  $("#sSyncSettings").checked = syncSettingsOn();
}
const ruErr = m => ({
  "Invalid login credentials":"Неверная почта или пароль",
  "Email not confirmed":"Почта не подтверждена — откройте письмо от Supabase и нажмите ссылку",
  "User already registered":"Такой пользователь уже есть — нажмите «Войти»",
  "Password should be at least 6 characters.":"Пароль должен быть не короче 6 символов"
}[m] || m);

async function initSync(){
  try{
    await loadSB();
    sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    const {data:{session}} = await sb.auth.getSession();
    sbUser = session?.user || null; renderSyncUI();
    sb.auth.onAuthStateChange((ev, s)=>{ const was = sbUser?.id; sbUser = s?.user || null; renderSyncUI(); if(sbUser && sbUser.id !== was) syncNow(); });
    if(sbUser) syncNow();
    setInterval(()=>{ if(sbUser && !document.hidden) syncNow(); }, 30000);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && sbUser) syncNow(); });
  }catch(e){ setBadge("⚠️ Синхронизация недоступна"); syncMsg(e.message, true); }
}

async function syncSettings(){
  const {data, error} = await sb.from("user_settings").select("data,updated_at").maybeSingle();
  if(error) throw error;
  const lu = settings.updatedAt || 0;
  if(data && data.updated_at > lu){
    const d = data.data || {};
    settings = {...structuredClone(DEFAULTS), ...d, keys:{...DEFAULTS.keys, ...(d.keys||{})}, updatedAt:data.updated_at};
    localStorage.setItem("aichat_settings", JSON.stringify(settings)); refreshTop();
  } else if(lu && (!data || lu > data.updated_at)){
    const {error:e2} = await sb.from("user_settings").upsert({user_id:sbUser.id, data:settings, updated_at:lu});
    if(e2) throw e2;
  }
}

async function syncNow(){
  if(!sb || !sbUser) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; setBadge("🔄 Синхронизация…");
  try{
    const {data:remote, error} = await sb.from("chats").select("id,updated_at,deleted");
    if(error) throw error;
    const rmap = new Map(remote.map(r=>[r.id, r]));
    const tomb = getTomb(); let changed = false; const busy = controller ? genChatId : null;
    // 1. скачать новое / удалить удалённое на других устройствах
    const need = [];
    for(const r of remote){
      const l = chats.find(c=>c.id===r.id);
      if(r.deleted){
        if(l && l.updated <= r.updated_at && l.id !== busy){ await dbDel(l.id); chats = chats.filter(c=>c.id!==l.id); changed = true; }
        continue;
      }
      if(tomb[r.id] || r.id === busy) continue;
      if(!l || r.updated_at > l.updated) need.push(r.id);
    }
    for(let i=0; i<need.length; i+=10){
      const {data, error:e} = await sb.from("chats").select("id,data,updated_at").in("id", need.slice(i,i+10));
      if(e) throw e;
      for(const row of data){
        const c = {...row.data, id:row.id, updated:row.updated_at};
        await dbPut(c); const k = chats.findIndex(x=>x.id===c.id); k>=0 ? chats[k]=c : chats.push(c); changed = true;
      }
    }
    // 2. отправить удаления
    const tIds = Object.keys(tomb);
    if(tIds.length){
      const {error:e} = await sb.from("chats").upsert(tIds.map(id=>({user_id:sbUser.id, id, data:{}, updated_at:tomb[id], deleted:true})), {onConflict:"user_id,id"});
      if(e) throw e;
      const t2 = getTomb(); tIds.forEach(id=>{ if(t2[id]===tomb[id]) delete t2[id]; }); setTomb(t2);
    }
    // 3. отправить изменённые локальные чаты
    const push = chats.filter(c => c.messages.length && c.id !== busy && !getTomb()[c.id] &&
      (!rmap.has(c.id) || c.updated > rmap.get(c.id).updated_at));
    for(let i=0; i<push.length; i+=5){
      const {error:e} = await sb.from("chats").upsert(push.slice(i,i+5).map(c=>({user_id:sbUser.id, id:c.id, data:c, updated_at:c.updated, deleted:false})), {onConflict:"user_id,id"});
      if(e) throw e;
    }
    // 4. настройки и ключи
    if(syncSettingsOn()) await syncSettings();
    if(changed && !controller){
      if(!current()){ if(chats.length){ chats.sort((a,b)=>b.updated-a.updated); currentId = chats[0].id; } else { syncing=false; newChat(); return; } }
      renderList(); renderMessages();
    }
    setBadge("☁️ Синхронизировано · " + new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}));
    syncMsg("");
  }catch(e){ setBadge("⚠️ Ошибка синхронизации"); syncMsg(e.message || String(e), true); console.error(e); }
  finally{ syncing = false; if(syncAgain){ syncAgain = false; scheduleSync(); } }
}

$("#loginBtn").onclick = async ()=>{
  const email = $("#sbEmail").value.trim(), password = $("#sbPass").value;
  if(!email || !password) return syncMsg("Введите почту и пароль", true);
  if(!sb) return syncMsg("Supabase не загрузился, проверьте интернет", true);
  syncMsg("Вход…");
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error) return syncMsg(ruErr(error.message), true);
  $("#sbPass").value = ""; syncMsg("Готово! Чаты синхронизируются.");
};
$("#signupBtn").onclick = async ()=>{
  const email = $("#sbEmail").value.trim(), password = $("#sbPass").value;
  if(!email || !password) return syncMsg("Введите почту и пароль", true);
  if(!sb) return syncMsg("Supabase не загрузился, проверьте интернет", true);
  syncMsg("Регистрация…");
  const redirect = location.protocol.startsWith("http") ? location.href.split("#")[0].split("?")[0] : undefined;
  const {data, error} = await sb.auth.signUp({email, password, options: redirect ? {emailRedirectTo:redirect} : {}});
  if(error) return syncMsg(ruErr(error.message), true);
  if(!data.session) syncMsg("Письмо отправлено на " + email + ". Подтвердите почту по ссылке, затем нажмите «Войти».");
  else syncMsg("Аккаунт создан, вы вошли.");
};
$("#logoutBtn").onclick = async ()=>{ await sb.auth.signOut(); syncMsg("Вы вышли. Чаты на этом устройстве остались."); };
$("#syncNowBtn").onclick = ()=>syncNow();
$("#sSyncSettings").onchange = e=>{ localStorage.setItem("aichat_sync_settings", e.target.checked ? "1" : "0"); if(e.target.checked) scheduleSync(); };

// ============ СТАРТ ============
(async ()=>{
  await openDB();
  chats = await dbAll();
  refreshTop();
  const saved = localStorage.getItem("aichat_current");
  if(chats.find(c=>c.id===saved)) currentId = saved; else if(chats.length) currentId = chats.sort((a,b)=>b.updated-a.updated)[0].id;
  if(!currentId) newChat(); else { renderList(); renderMessages(); }
  if(innerWidth<760) $("#sidebar").classList.add("hidden");
  updateSendBtn(); input.focus();
  initSync();
})();
</script>
